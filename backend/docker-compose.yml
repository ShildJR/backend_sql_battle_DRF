version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sql_battle
      POSTGRES_USER: sql_user
      POSTGRES_PASSWORD: sql_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=change-this-in-production
      - DEBUG=True
      - DATABASE_URL=postgresql://sql_user:sql_password@db:5432/sql_battle
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - db
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata api/fixtures/tasks.json 2>/dev/null;
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
